<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">AI</div>

            <div>
                <h1>AI Chatbot</h1>
                <p>Your simple AI-powered assistant</p>
            </div>

            <div class="status">
                ● Online
            </div>
        </header>

        <main class="chat" id="chat">

            <div class="message bot">
                <div class="avatar">AI</div>

                <div class="bubble">
                    Hello! 👋 I'm your AI assistant. Ask me anything!
                </div>
            </div>

        </main>

        <div class="suggestions">

            <button type="button" onclick="useSuggestion('What is AI?')">
                What is AI?
            </button>

            <button type="button" onclick="useSuggestion('How can I learn Python?')">
                Learn Python
            </button>

            <button type="button" onclick="useSuggestion('Give me some study tips')">
                Study tips
            </button>

        </div>

        <form class="input-area" id="chat-form">

            <input
                type="text"
                id="message-input"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button type="submit" id="send-button">
                Send ➤
            </button>

        </form>

        <footer>
            AI-generated responses may not always be accurate.
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
